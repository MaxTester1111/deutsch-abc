  const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) / 10)), o = [];

}

const sharedAudio = new Audio();

// Alle 29 MP3-Dateien vorab laden, damit sie auf dem Handy sofort und ohne Blockade abspielen
DATA.forEach(d => {
  const l = d[0], url = "audio/" + encodeURIComponent(l) + ".mp3";

      .catch(() => {});
  }
});

// Entsperrt Audio auf Mobilgeräten beim ersten Fingerkontakt
function unlockAudio() {
  if (actxAudio && actxAudio.state === "suspended") actxAudio.resume().catch(() => {});
}

// Spielt audio/<Buchstabe>.mp3 ab (z. B. audio/M.mp3); fehlt die Datei, bleibt es still
function laut(l) {
  const key = l.toUpperCase();
  if (curSource) { try { curSource.stop(); } catch (_) {} curSource = null; }
  sharedAudio.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (actxAudio && audioBuffers[key]) {
    if (actxAudio.state === "suspended") actxAudio.resume().catch(() => {});
    const src = actxAudio.createBufferSource();
    src.buffer = audioBuffers[key];
    src.connect(actxAudio.destination);
    src.start(0);
    curSource = src;
    return;
  }
  sharedAudio.src = "audio/" + encodeURIComponent(key) + ".mp3";
  sharedAudio.currentTime = 0;
  sharedAudio.play().catch(() => {});
}

    ddTimers.push(t);
  } else {
    ddTop.style.transition = "none";
    ddTop.style.transform = "";
    warn(ddTop);
  }
}
ddTop.addEventListener("pointerup", endDdDrag);
ddTop.addEventListener("pointercancel", endDdDrag);

// ---------- Übung 5: Groß- und Kleinbuchstaben verbinden (A ➔ a) ----------
const pLeft = $("pLeft"), pRight = $("pRight");
let pairIdx = 0, pairBusy = false, pairInDemo = false, pairDrag = null, pairTimers = [];

function stopPairDemo() {
  pairInDemo = false;
  pairTimers.forEach(t => clearTimeout(t));
  pairTimers = [];
  ddFinger.style.display = "none";
  ddFinger.style.transition = "none";
  pLeft.style.transition = "";
  pLeft.style.transform = "";
  pLeft.classList.remove("speak", "ok", "dragging");
  pRight.classList.remove("speak", "ok");
  pairDrag = null;
}
function playPairSequence(letter, onDone) {
  pLeft.classList.remove("speak");
  pRight.classList.remove("speak");
  const t1 = setTimeout(() => {
    if (mode !== 5) return;
    pLeft.classList.add("speak");
    laut(letter);
  }, 200);
  const t2 = setTimeout(() => {
    if (mode !== 5) return;
    pLeft.classList.remove("speak");
  }, 950);
  const t3 = setTimeout(() => {
    if (mode !== 5) return;
    pRight.classList.add("speak");
    laut(letter);
  }, 1500);
  const t4 = setTimeout(() => {
    if (mode !== 5) return;
    pRight.classList.remove("speak");
    if (onDone) onDone();
  }, 2300);
  pairTimers.push(t1, t2, t3, t4);
}
function setupPairBoard(letter, onSeqDone) {
  pLeft.textContent = letter.toUpperCase();
  pRight.textContent = letter.toLowerCase();
  pLeft.style.transition = "";
  pLeft.style.transform = "";
  pLeft.classList.remove("speak", "ok", "dragging");
  pRight.classList.remove("speak", "ok");
  playPairSequence(letter, onSeqDone);
}
$("spPair").onclick = () => {
  if (mode === 5 && !pairInDemo) playPairSequence(LETTERS_UP[pairIdx]);
};
function startPairRound() {
  stopPairDemo();
  pairIdx = 0;
  runPairDemo();
}
function runPairDemo(left = 2) {
  pairBusy = true;
  pairInDemo = true;
  pairTimers.forEach(t => clearTimeout(t));
  pairTimers = [];
  setupPairBoard("A", () => {
    if (mode !== 5 || !pairInDemo) return;
    const rL = pLeft.getBoundingClientRect();
    const rR = pRight.getBoundingClientRect();
    const sx = rL.left + rL.width * 0.35, sy = rL.top + rL.height * 0.45;
    const dx = (rR.left + rR.width / 2) - (rL.left + rL.width / 2);
    const dy = (rR.top + rR.height / 2) - (rL.top + rL.height / 2);
    ddFinger.style.transition = "none";
    ddFinger.style.left = sx + "px";
    ddFinger.style.top = sy + "px";
    ddFinger.style.transform = "translate(0, 0) scale(1)";
    ddFinger.style.display = "block";
    const tDrag = setTimeout(() => {
      if (mode !== 5 || !pairInDemo) return;
      pLeft.classList.add("dragging");
      pLeft.style.transition = "transform 1.8s ease-in-out";
      ddFinger.style.transition = "transform 1.8s ease-in-out";
      pLeft.style.transform = `translate(${dx}px, ${dy}px)`;
      ddFinger.style.transform = `translate(${dx}px, ${dy}px) scale(0.95)`;
    }, 500);
    const tHit = setTimeout(() => {
      if (mode !== 5 || !pairInDemo) return;
      pLeft.classList.remove("dragging");
      pLeft.style.transition = "transform .2s ease, background .2s, color .2s";
      pLeft.style.transform = "";
      ddFinger.style.display = "none";
      pLeft.classList.add("ok");
      pRight.classList.add("ok");
    }, 2350);
    const tNext = setTimeout(() => {
      if (mode !== 5 || !pairInDemo) return;
      if (left > 1) runPairDemo(left - 1);
      else { pairInDemo = false; nextPairTask(); }
    }, 3400);
    pairTimers.push(tDrag, tHit, tNext);
  });
}
function nextPairTask() {
  pairTimers.forEach(t => clearTimeout(t));
  pairTimers = [];
  if (pairIdx >= LETTERS_UP.length) {
    pairBusy = true;
    finale();
    return;
  }
  pairBusy = false;
  setupPairBoard(LETTERS_UP[pairIdx]);
}
pLeft.addEventListener("pointerdown", e => {
  if (mode !== 5 || pairBusy) return;
  pLeft.setPointerCapture(e.pointerId);
  pLeft.classList.remove("speak");
  pRight.classList.remove("speak");
  pLeft.classList.add("dragging");
  pLeft.style.transition = "none";
  pairDrag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
});
pLeft.addEventListener("pointermove", e => {
  if (!pairDrag || e.pointerId !== pairDrag.id) return;
  pairDrag.dx = e.clientX - pairDrag.sx;
  pairDrag.dy = e.clientY - pairDrag.sy;
  pLeft.style.transform = `translate(${pairDrag.dx}px, ${pairDrag.dy}px)`;
});
function endPairDrag(e) {
  if (!pairDrag || e.pointerId !== pairDrag.id) return;
  pLeft.classList.remove("dragging");
  const rL = pLeft.getBoundingClientRect();
  const rR = pRight.getBoundingClientRect();
  pairDrag = null;
  const ox = Math.max(0, Math.min(rL.right, rR.right) - Math.max(rL.left, rR.left));
  const oy = Math.max(0, Math.min(rL.bottom, rR.bottom) - Math.max(rL.top, rR.top));
  const pointerInside = e.clientX >= rR.left && e.clientX <= rR.right && e.clientY >= rR.top && e.clientY <= rR.bottom;
  if (pointerInside || (ox * oy > (rR.width * rR.height) * 0.2)) {
    pairBusy = true;
    pairTimers.forEach(t => clearTimeout(t));
    pairTimers = [];
    pLeft.style.transition = "transform .2s ease, background .2s, color .2s";
    pLeft.style.transform = "";
    pLeft.classList.add("ok");
    pRight.classList.add("ok");
    pairIdx++;
    const t = setTimeout(() => { if (mode === 5) nextPairTask(); }, 800);
    pairTimers.push(t);
  } else {
    pLeft.style.transition = "transform .2s ease-out";
    pLeft.style.transform = "";
  }
}
pLeft.addEventListener("pointerup", endPairDrag);
pLeft.addEventListener("pointercancel", endPairDrag);

// ---------- Übung 6: Großbuchstaben links oben in passenden Kleinbuchstaben rechts ziehen ----------
const m6Left = $("m6Left");
const m6Cards = Array.from(document.querySelectorAll("#m6Col .m6-card"));
let m6Idx = 0, m6Target = "A", m6Busy = false, m6InDemo = false, m6Drag = null, m6Timers = [];

function stopM6Demo() {
  m6InDemo = false;
  m6Timers.forEach(t => clearTimeout(t));
  m6Timers = [];
  ddFinger.style.display = "none";
  ddFinger.style.transition = "none";
  m6Left.style.transition = "none";
  m6Left.style.transform = "";
  m6Left.style.opacity = "1";
  m6Left.classList.remove("wackeln", "dragging");
  m6Cards.forEach(c => c.classList.remove("ok"));
  m6Drag = null;
}
function setupM6Board(letter, fixedChoices) {
  m6Target = letter;
  const low = letter.toLowerCase();
  m6Left.textContent = letter;
  m6Left.style.transition = "none";
  m6Left.style.transform = "";
  m6Left.style.opacity = "1";
  m6Left.classList.remove("wackeln", "dragging");
  const choices = fixedChoices || (() => {
    const pool = shuffle(LETTERS_LOW.filter(x => x !== low)).slice(0, 2);
    pool.push(low);
    return shuffle(pool);
  })();
  m6Cards.forEach((c, idx) => {
    c.textContent = choices[idx];
    c.classList.remove("ok");
  });
  const ts = setTimeout(() => { if (mode === 6) laut(letter); }, 150);
  m6Timers.push(ts);
}
$("spM6").onclick = () => laut(m6Target);
function startM6Round() {
  stopM6Demo();
  m6Idx = 0;
  runM6Demo();
}
function runM6Demo(left = 2) {
  m6Busy = true;
  m6InDemo = true;
  setupM6Board("A", ["b", "a", "m"]);
  const t1 = setTimeout(() => {
    if (mode !== 6 || !m6InDemo) return;
    const rL = m6Left.getBoundingClientRect();
    const targetCard = m6Cards[1];
    const rTar = targetCard.getBoundingClientRect();
    const sx = rL.left + rL.width * 0.35, sy = rL.top + rL.height * 0.45;
    const dx = (rTar.left + rTar.width / 2) - (rL.left + rL.width / 2);
    const dy = (rTar.top + rTar.height / 2) - (rL.top + rL.height / 2);
    ddFinger.style.transition = "none";
    ddFinger.style.left = sx + "px";
    ddFinger.style.top = sy + "px";
    ddFinger.style.transform = "translate(0, 0) scale(1)";
    ddFinger.style.display = "block";
    const t2 = setTimeout(() => {
      if (mode !== 6 || !m6InDemo) return;
      m6Left.classList.add("dragging");
      m6Left.style.transition = "transform 1.6s ease-in-out";
      ddFinger.style.transition = "transform 1.6s ease-in-out";
      m6Left.style.transform = `translate(${dx}px, ${dy}px)`;
      ddFinger.style.transform = `translate(${dx}px, ${dy}px) scale(0.95)`;
    }, 500);
    const t3 = setTimeout(() => {
      if (mode !== 6 || !m6InDemo) return;
      m6Left.classList.remove("dragging");
      m6Left.style.opacity = "0";
      ddFinger.style.display = "none";
      targetCard.classList.add("ok");
    }, 2150);
    const t4 = setTimeout(() => {
      if (mode !== 6 || !m6InDemo) return;
      if (left > 1) runM6Demo(left - 1);
      else { m6InDemo = false; nextM6Task(); }
    }, 3100);
    m6Timers.push(t2, t3, t4);
  }, 450);
  m6Timers.push(t1);
}
function nextM6Task() {
  if (m6Idx >= LETTERS_UP.length) {
    m6Busy = true;
    finale();
    return;
  }
  m6Busy = false;
  setupM6Board(LETTERS_UP[m6Idx]);
}
m6Left.addEventListener("pointerdown", e => {
  if (mode !== 6 || m6Busy) return;
  m6Left.setPointerCapture(e.pointerId);
  m6Left.classList.remove("wackeln");
  m6Left.classList.add("dragging");
  m6Left.style.transition = "none";
  m6Drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
});
m6Left.addEventListener("pointermove", e => {
  if (!m6Drag || e.pointerId !== m6Drag.id) return;
  m6Drag.dx = e.clientX - m6Drag.sx;
  m6Drag.dy = e.clientY - m6Drag.sy;
  m6Left.style.transform = `translate(${m6Drag.dx}px, ${m6Drag.dy}px)`;
});
function endM6Drag(e) {
  if (!m6Drag || e.pointerId !== m6Drag.id) return;
  m6Left.classList.remove("dragging");
  const rL = m6Left.getBoundingClientRect();
  const cx = rL.left + rL.width / 2, cy = rL.top + rL.height / 2;
  m6Drag = null;
  let hit = null, bestDist = Infinity;
  for (const c of m6Cards) {
    const r = c.getBoundingClientRect();
    const ox = Math.max(0, Math.min(rL.right, r.right) - Math.max(rL.left, r.left));
    const oy = Math.max(0, Math.min(rL.bottom, r.bottom) - Math.max(rL.top, r.top));
    const pointerInside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (pointerInside || (ox * oy > (r.width * r.height) * 0.2)) {
      const dist = Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2));
      if (dist < bestDist) { bestDist = dist; hit = c; }
    }
  }
  if (!hit) {
    m6Left.style.transition = "transform .2s ease-out";
    m6Left.style.transform = "";
    return;
  }
  if (hit.textContent === m6Target.toLowerCase()) {
    m6Busy = true;
    m6Left.style.opacity = "0";
    hit.classList.add("ok");
    m6Idx++;
    const t = setTimeout(() => { if (mode === 6) nextM6Task(); }, 600);
    m6Timers.push(t);
  } else {
    m6Left.style.transition = "none";
    m6Left.style.transform = "";
    warn(m6Left);
  }
}
m6Left.addEventListener("pointerup", endM6Drag);
m6Left.addEventListener("pointercancel", endM6Drag);
$("next").onclick = () => {
  if (m1Busy) return;
  if (strokes.length === 0) warn();
  else if (i === DATA.length - 1) finale();
  else go(i + 1);
};

DATA.forEach((d, k) => {
  const b = document.createElement("button");
  b.textContent = d[0];
  b.onclick = () => { if (!m1Busy) go(k); };
  $("strip").appendChild(b);
});
window.addEventListener("resize", fit);
fit(); setMode(1);
