<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%231f3a5f'/%3E%3Ctext x='256' y='350' font-family='Arial' font-weight='bold' font-size='260' text-anchor='middle' fill='white'%3EABC%3C/text%3E%3C/svg%3E">
<title>ABC</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #f4f1ea; color: #1f3a5f;
    font-family: Arial, Helvetica, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #main { flex: 1; display: flex; gap: 16px; padding: 16px; min-height: 0; }
  #left { flex: 0 0 38%; background: #fff; border-radius: 24px; box-shadow: 0 2px 8px #0002;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  #big { font-size: min(34vh, 24vw); font-weight: bold; line-height: 1; letter-spacing: .05em; }
  .row { display: flex; gap: 14px; align-items: center; }
  #wordbox { text-align: center; }
  #emoji { font-size: min(14vh, 10vw); line-height: 1.1; }
  #word { font-size: min(7vh, 5vw); }
  #word b { color: #d9480f; }
  #right { flex: 1; position: relative; background: #fff; border-radius: 24px; box-shadow: 0 2px 8px #0002; overflow: hidden; }
  #ghost { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: bold; color: #c9d3e0; pointer-events: none; line-height: 1; }
  #ghost.off { visibility: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  button { border: none; border-radius: 50%; background: #1f3a5f; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px #0003; }
  button:active { transform: scale(.92); }
  .sp { width: 84px; height: 84px; }
  .sp svg { width: 46px; height: 46px; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 0 16px 14px; }
  .nav { width: 96px; height: 96px; background: #2b8a3e; font-size: 56px; flex: 0 0 auto; }
  #strip { flex: 1; display: flex; gap: 6px; overflow-x: auto; padding: 6px; touch-action: pan-x; }
  #strip button { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 14px; background: #fff; color: #1f3a5f;
    font-size: 28px; font-weight: bold; }
  #strip button.cur { background: #1f3a5f; color: #fff; }
  @keyframes wackeln {
    0%   { transform: translateX(0);     box-shadow: 0 0 0 0 #e03131, 0 2px 8px #0002; }
    15%  { transform: translateX(-16px); box-shadow: 0 0 0 8px #e03131, 0 2px 8px #0002; }
    35%  { transform: translateX(14px);  box-shadow: 0 0 0 8px #e03131, 0 2px 8px #0002; }
    55%  { transform: translateX(-10px); box-shadow: 0 0 0 8px #e03131, 0 2px 8px #0002; }
    75%  { transform: translateX(6px);   box-shadow: 0 0 0 8px #e03131, 0 2px 8px #0002; }
    100% { transform: translateX(0);     box-shadow: 0 0 0 0 #e03131, 0 2px 8px #0002; }
  }
  #right.wackeln, #ddTop.wackeln { animation: wackeln .55s ease-in-out; }
  #fin { position: fixed; inset: 0; z-index: 10; background: #f4f1ea; display: none;
    flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  #fin.show { display: flex; }
  #fin .star { font-size: min(45vh, 40vw); line-height: 1; animation: puls 1s ease-in-out infinite; }
  #fin .txt { font-size: min(18vh, 14vw); font-weight: bold; color: #1f3a5f; }
  .konf { position: absolute; top: -5vh; width: 14px; height: 22px; border-radius: 3px;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
  @keyframes puls { 50% { transform: scale(1.12); } }
  #tpl, #anim { pointer-events: none; }
  body:not(.m1) #tpl, body:not(.m1) #anim, body:not(.m1) #spSound { display: none; }
  body.m1 #wordbox, body.m1 #ghost { display: none; }
  body.m2 #main, body.m2 #bar { display: none; }
  #dd { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: space-evenly;
    padding: 16px; min-height: 0; position: relative; }
  body.m2 #dd { display: flex; }
  #ddTopWrap { display: flex; align-items: center; justify-content: center; gap: 20px; }
  #ddTop { width: min(34vh, 22vw); height: min(34vh, 22vw); background: #fff; border-radius: 24px;
    box-shadow: 0 4px 14px #0002; display: flex; align-items: center; justify-content: center;
    font-size: min(22vh, 14vw); font-weight: bold; cursor: grab; position: relative; z-index: 6;
    touch-action: none; }
  #ddTop.dragging { box-shadow: 0 12px 28px #0004; cursor: grabbing; }
  #ddGrid { display: grid; grid-template-columns: repeat(4, auto); gap: min(3vh, 3vw);
    align-items: center; justify-content: center; }
  .dd-card { width: min(34vh, 21vw); height: min(34vh, 21vw); background: #fff; border-radius: 24px;
    box-shadow: 0 2px 8px #0002; display: flex; align-items: center; justify-content: center;
    font-size: min(22vh, 13vw); font-weight: bold; border: 6px solid transparent;
    transition: transform .2s, background .2s, color .2s, border-color .2s; }
  .dd-card.ok { background: #2b8a3e; color: #fff; border-color: #2b8a3e; transform: scale(1.06); }
  #ddFinger { position: fixed; z-index: 15; font-size: min(24vh, 24vw); line-height: 1;
    pointer-events: none; display: none; filter: drop-shadow(0 4px 8px #0005); }
  #mode { position: fixed; top: 24px; right: 24px; z-index: 8; width: 52px; height: 52px;
    font-size: 28px; font-weight: bold; background: #5b6f8a; }
  #menu { position: fixed; inset: 0; z-index: 20; background: #0007; display: none;
    align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 16px; }
  #menu.show { display: flex; }
  #menu .opt { width: min(34vh, 28vw); height: min(42vh, 36vw); border-radius: 28px; background: #fff; color: #1f3a5f;
    flex-direction: column; gap: 10px; border: 6px solid transparent; }
  #menu .opt.cur { border-color: #2b8a3e; }
  #menu .opt .n { font-size: min(12vh, 10vw); font-weight: bold; line-height: 1; }
  #menu .opt .v { font-size: min(7vh, 6vw); font-weight: bold; line-height: 1.1; letter-spacing: .05em; }
  @media (orientation: portrait) {
    #main { flex-direction: column; } #left { flex: 0 0 42%; }
    #ddTop { width: min(23vh, 38vw); height: min(23vh, 38vw); font-size: min(15vh, 24vw); }
    #ddGrid { grid-template-columns: repeat(2, auto); gap: min(2.5vh, 4vw); }
    .dd-card { width: min(23vh, 38vw); height: min(23vh, 38vw); font-size: min(15vh, 24vw); }
    #ddFinger { font-size: min(20vh, 34vw); }
    #menu .opt { width: min(26vh, 42vw); height: min(26vh, 42vw); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="left">
      <div id="big">A</div>
      <button class="sp" id="spSound" aria-label="Laut sprechen">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </button>
      <div id="wordbox">
        <div id="emoji"></div>
        <div class="row" style="justify-content:center">
          <div id="word"></div>
          <button class="sp" id="spWord" aria-label="Wort sprechen">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="right">
      <div id="ghost"></div>
      <canvas id="tpl"></canvas>
      <canvas id="anim"></canvas>
      <canvas id="cv"></canvas>
    </div>
  </div>
  <div id="bar">
    <div id="strip"></div>
    <button class="nav" id="next" aria-label="Weiter">▶</button>
  </div>
  <div id="dd">
    <div id="ddTopWrap">
      <div id="ddTop">A</div>
      <button class="sp" id="spDd" aria-label="Laut sprechen">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      </button>
    </div>
    <div id="ddGrid">
      <div class="dd-card">A</div>
      <div class="dd-card">B</div>
      <div class="dd-card">C</div>
      <div class="dd-card">D</div>
    </div>
  </div>
</div>
<div id="ddFinger">👆</div>

<div id="fin"><div class="star">⭐</div><div class="txt">Super!</div></div>

<button id="mode" aria-label="Übung wählen">1</button>
<div id="menu">
  <button class="opt" data-m="1"><div class="n">1</div><div class="v">ABC</div></button>
  <button class="opt" data-m="2"><div class="n">2</div><div class="v">A ➔ A</div></button>
  <button class="opt" data-m="3"><div class="n">3</div><div class="v">🍎🍌🚕</div></button>
</div>

<script>
const DATA = [
 ["A","Ah","Apfel","🍎"],["B","Beh","Banane","🍌"],["C","Zeh","Computer","💻"],["D","Deh","Dusche","🚿"],
 ["E","Eh","Essen","🍽️"],["F","Eff","Fisch","🐟"],["G","Geh","Gabel","🍴"],["H","Hah","Haus","🏠"],
 ["I","Ih","Igel","🦔"],["J","Jott","Jacke","🧥"],["K","Kah","Katze","🐱"],["L","Ell","Lampe","💡"],
 ["M","Emm","Milch","🥛"],["N","Enn","Nase","👃"],["O","Oh","Ohr","👂"],["P","Peh","Pizza","🍕"],
 ["Q","Kuh","Quadrat","⬜"],["R","Err","Regen","🌧️"],["S","Ess","Straße","🛣️"],["T","Teh","Toilette","🚽"],
 ["U","Uh","Uhr","🕐"],["V","Fau","Vogel","🐦"],["W","Weh","Wasser","💧"],["X","Iks","Taxi","🚕"],
 ["Y","Üpsilon","Yacht","⛵"],["Z","Zett","Zug","🚆"],["Ä","Äh","Ärmel","👕"],["Ö","Öh","Öl","🛢️"],
 ["Ü","Üh","Überraschung","🎁"]
];
let i = 0, upper = true, strokes = [], cur = null;
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let mode = 1;

// ---------- Übung 1: Laute und Schreibrichtung ----------
// Lautschrift für die Computerstimme (leicht anpassbar, falls ein Laut schlecht klingt)
const SOUND = {
  A:"aaa", B:"bö", C:"kö", D:"dö", E:"eee", F:"fff", G:"gö", H:"hö", I:"iii", J:"jö", K:"kö", L:"lll", M:"mmm",
  N:"nnn", O:"ooo", P:"pö", Q:"kwö", R:"rrr", S:"sss", T:"tö", U:"uuu", V:"fff", W:"wö", X:"ks", Y:"üüü", Z:"tsö",
  Ä:"äää", Ö:"ööö", Ü:"üüü"
};
// Buchstaben als Striche in einem Feld von 80 x 100, in der Reihenfolge, wie man sie schreibt
function arc(cx, cy, rx, ry, a0, a1) {
  const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) / 10)), o = [];
  for (let k = 0; k <= n; k++) {
    const a = (a0 + (a1 - a0) * k / n) * Math.PI / 180;
    o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return o;
}
function uml(base) {
  return base.map(s => s.map(p => [p[0], 22 + p[1] * 0.78])).concat([[[28, 6], [28, 7]], [[52, 6], [52, 7]]]);
}
const G_A = [[[4,100],[40,0],[76,100]], [[17,65],[63,65]]];
const G_O = [arc(40,50,38,50,-90,-450)];
const G_U = [[[8,0],[8,65]].concat(arc(40,65,32,35,180,0), [[72,0]])];
const GLYPH = {
  A: G_A,
  B: [[[8,0],[8,100]], [[8,0],[45,0]].concat(arc(45,25,25,25,-90,90), [[48,50]], arc(48,75,27,25,-90,90), [[8,100]])],
  C: [arc(40,50,38,50,-40,-320)],
  D: [[[8,0],[8,100]], [[8,0],[35,0]].concat(arc(35,50,40,50,-90,90), [[8,100]])],
  E: [[[10,0],[10,100]], [[10,0],[70,0]], [[10,50],[60,50]], [[10,100],[70,100]]],
  F: [[[10,0],[10,100]], [[10,0],[70,0]], [[10,50],[60,50]]],
  G: [arc(40,50,38,50,-40,-360), [[78,50],[42,50]]],
  H: [[[8,0],[8,100]], [[72,0],[72,100]], [[8,50],[72,50]]],
  I: [[[40,0],[40,100]]],
  J: [[[55,0],[55,70]].concat(arc(30,70,25,30,0,150))],
  K: [[[10,0],[10,100]], [[10,50],[70,0]], [[10,50],[70,100]]],
  L: [[[10,0],[10,100]], [[10,100],[70,100]]],
  M: [[[8,100],[8,0],[40,65],[72,0],[72,100]]],
  N: [[[8,100],[8,0],[72,100],[72,0]]],
  O: G_O,
  P: [[[8,0],[8,100]], [[8,0],[40,0]].concat(arc(40,25,28,25,-90,90), [[8,50]])],
  Q: G_O.concat([[[48,70],[75,100]]]),
  R: [[[8,0],[8,100]], [[8,0],[40,0]].concat(arc(40,25,28,25,-90,90), [[8,50]]), [[34,50],[72,100]]],
  S: [arc(40,25,28,25,-30,-270).concat(arc(40,75,30,25,-90,150))],
  T: [[[5,0],[75,0]], [[40,0],[40,100]]],
  U: G_U,
  V: [[[4,0],[40,100],[76,0]]],
  W: [[[2,0],[20,100],[40,25],[60,100],[78,0]]],
  X: [[[6,0],[74,100]], [[74,0],[6,100]]],
  Y: [[[6,0],[40,50]], [[74,0],[40,50],[40,100]]],
  Z: [[[8,0],[72,0],[8,100],[72,100]]],
  Ä: uml(G_A), Ö: uml(G_O), Ü: uml(G_U)
};
const tpl = $("tpl"), an = $("anim"), tctx = tpl.getContext("2d"), actx = an.getContext("2d");
function geom() {
  const W = cv.width, H = cv.height, u = Math.min(H * 0.78 / 100, W * 0.8 / 80);
  return { u, ox: (W - 80 * u) / 2, oy: (H - 100 * u) / 2 };
}
function toPx(s, g) { return s.map(p => [g.ox + p[0] * g.u, g.oy + p[1] * g.u]); }
function drawTemplate() {
  tctx.clearRect(0, 0, tpl.width, tpl.height);
  if (mode !== 1) return;
  const g = geom();
  tctx.lineCap = tctx.lineJoin = "round";
  tctx.strokeStyle = "#c9d3e0";
  tctx.lineWidth = tpl.height * 0.075;
  for (const s of GLYPH[DATA[i][0]]) {
    const p = toPx(s, g);
    tctx.beginPath();
    p.forEach((q, k) => k ? tctx.lineTo(q[0], q[1]) : tctx.moveTo(q[0], q[1]));
    tctx.stroke();
  }
}
let anim = null;
function stopAnim() {
  if (anim) { cancelAnimationFrame(anim.raf); anim = null; }
  actx.clearRect(0, 0, an.width, an.height);
}
function partial(pts, d) {
  const out = [pts[0]];
  let acc = 0, ang = 0;
  for (let k = 1; k < pts.length; k++) {
    const dx = pts[k][0] - pts[k-1][0], dy = pts[k][1] - pts[k-1][1], sl = Math.hypot(dx, dy);
    ang = Math.atan2(dy, dx);
    if (acc + sl >= d) {
      const r = sl ? (d - acc) / sl : 0;
      out.push([pts[k-1][0] + dx * r, pts[k-1][1] + dy * r]);
      return { out, ang };
    }
    out.push(pts[k]); acc += sl;
  }
  return { out, ang };
}
function drawPart(pts, len, prog, head, num, many) {
  const H = an.height, { out, ang } = partial(pts, len * prog);
  actx.lineCap = actx.lineJoin = "round";
  actx.strokeStyle = "#f08c00";
  actx.lineWidth = H * 0.03;
  actx.beginPath();
  out.forEach((q, k) => k ? actx.lineTo(q[0], q[1]) : actx.moveTo(q[0], q[1]));
  actx.stroke();
  if (many) {
    actx.fillStyle = "#d9480f";
    actx.beginPath(); actx.arc(pts[0][0], pts[0][1], H * 0.032, 0, Math.PI * 2); actx.fill();
    actx.fillStyle = "#fff"; actx.font = "bold " + (H * 0.04) + "px Arial";
    actx.textAlign = "center"; actx.textBaseline = "middle";
    actx.fillText(num, pts[0][0], pts[0][1] + 1);
  }
  if (head) {
    const t = out[out.length - 1], s = H * 0.055;
    actx.save(); actx.translate(t[0], t[1]); actx.rotate(ang);
    actx.fillStyle = "#d9480f";
    actx.beginPath(); actx.moveTo(s * 0.7, 0); actx.lineTo(-s * 0.5, -s * 0.6); actx.lineTo(-s * 0.5, s * 0.6); actx.closePath(); actx.fill();
    actx.restore();
  }
}
function startAnim() {
  stopAnim();
  if (mode !== 1) return;
  const g = geom();
  const st = GLYPH[DATA[i][0]].map(s => toPx(s, g));
  const lens = st.map(s => { let L = 0; for (let k = 1; k < s.length; k++) L += Math.hypot(s[k][0] - s[k-1][0], s[k][1] - s[k-1][1]); return L; });
  const durs = lens.map(L => 900 + L * 2.4), gap = 450, hold = 1700;
  const total = durs.reduce((a, d) => a + d + gap, 0) + hold;
  const t0 = performance.now(), a = { raf: 0 };
  anim = a;
  function frame(now) {
    if (anim !== a) return;
    const t = (now - t0) % total;
    actx.clearRect(0, 0, an.width, an.height);
    let acc = 0;
    for (let k = 0; k < st.length; k++) {
      if (t >= acc + durs[k] + gap) { drawPart(st[k], lens[k], 1, false, k + 1, st.length > 1); acc += durs[k] + gap; continue; }
      if (t >= acc) drawPart(st[k], lens[k], Math.min(1, (t - acc) / durs[k]), true, k + 1, st.length > 1);
      break;
    }
    a.raf = requestAnimationFrame(frame);
  }
  a.raf = requestAnimationFrame(frame);
}

// ---------- Sprache ----------
let voice = null;
function pickVoice() {
  const v = speechSynthesis.getVoices();
  voice = v.find(x => /^de[-_]DE/i.test(x.lang)) || v.find(x => /^de/i.test(x.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; if (voice) u.voice = voice;
  u.rate = 0.7;
  speechSynthesis.speak(u);
}

// ---------- Anzeige ----------
function letterShown(l) { return upper ? l.toUpperCase() : (l === "ß" ? "ß" : l.toLowerCase()); }
function render() {
  const [l, name, word, emoji] = DATA[i];
  $("big").textContent = l === "ß" ? "ß" : l.toUpperCase();
  $("emoji").textContent = emoji;
  const re = new RegExp(l, "i");
  $("word").innerHTML = word.replace(re, m => "<b>" + m + "</b>");
  updateGhost();
  strokes = []; redraw();
  drawTemplate(); startAnim();
  document.querySelectorAll("#strip button").forEach((b, k) => b.classList.toggle("cur", k === i));
  const c = document.querySelector("#strip button.cur"); if (c) c.scrollIntoView({inline: "center", block: "nearest"});
}
function updateGhost() {
  const g = $("ghost");
  g.textContent = letterShown(DATA[i][0]);
  const r = $("right").getBoundingClientRect();
  g.style.fontSize = Math.min(r.height * 0.95, r.width * 0.9) + "px";
}

// ---------- Whiteboard ----------
function fit() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = tpl.width = an.width = r.width * d;
  cv.height = tpl.height = an.height = r.height * d;
  updateGhost(); redraw(); drawTemplate(); startAnim();
}
function redraw() {
  const w = cv.width, h = cv.height;
  ctx.clearRect(0, 0, w, h);
  ctx.lineCap = ctx.lineJoin = "round";
  ctx.strokeStyle = "#1f3a5f";
  ctx.lineWidth = Math.max(10, Math.min(w, h) * 0.035);
  for (const s of strokes) {
    ctx.beginPath();
    s.forEach((p, k) => k ? ctx.lineTo(p[0] * w, p[1] * h) : ctx.moveTo(p[0] * w, p[1] * h));
    if (s.length === 1) ctx.lineTo(s[0][0] * w + 0.1, s[0][1] * h);
    ctx.stroke();
  }
}
function pt(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
cv.addEventListener("pointerdown", e => { if (m1Busy) return; cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); redraw(); });
cv.addEventListener("pointermove", e => { if (!cur) return; cur.push(pt(e)); redraw(); });
["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, () => { cur = null; }));

// ---------- Übung 1: Spielanleitung (Finger-Visualisierung) ----------
let m1Busy = false, m1Timers = [], m1Raf = 0;
function stopM1Demo() {
  m1Busy = false;
  m1Timers.forEach(t => clearTimeout(t));
  m1Timers = [];
  if (m1Raf) { cancelAnimationFrame(m1Raf); m1Raf = 0; }
  $("spSound").style.transform = "";
  $("next").style.transform = "";
  if (typeof ddFinger !== "undefined" && ddFinger) {
    ddFinger.style.display = "none";
    ddFinger.style.transition = "none";
    ddFinger.style.transform = "";
  }
}
function setFingerPos(cx, cy, smoothMs) {
  ddFinger.style.display = "block";
  const fr = ddFinger.getBoundingClientRect();
  const x = cx - fr.width * 0.42, y = cy - fr.height * 0.06;
  ddFinger.style.transition = smoothMs ? `left ${smoothMs}ms ease-in-out, top ${smoothMs}ms ease-in-out, transform .2s` : "none";
  ddFinger.style.left = x + "px";
  ddFinger.style.top = y + "px";
}
function runM1Demo() {
  stopM1Demo();
  m1Busy = true;
  i = 0; render(); stopAnim();
  const t1 = setTimeout(() => {
    if (mode !== 1 || !m1Busy) return;
    const g = geom();
    const st0 = toPx(GLYPH["A"][0], g)[0];
    const rCv = cv.getBoundingClientRect();
    setFingerPos(rCv.left + rCv.width * 0.5, rCv.bottom - 20, 0);
    ddFinger.style.transform = "scale(1)";
    const tGlide = setTimeout(() => {
      if (mode !== 1 || !m1Busy) return;
      setFingerPos(rCv.left + (st0[0] / cv.width) * rCv.width, rCv.top + (st0[1] / cv.height) * rCv.height, 800);
    }, 80);
    const tTrace = setTimeout(() => {
      if (mode !== 1 || !m1Busy) return;
      startAnim();
      const st = GLYPH["A"].map(s => toPx(s, g));
      const lens = st.map(s => { let L = 0; for (let k = 1; k < s.length; k++) L += Math.hypot(s[k][0] - s[k-1][0], s[k][1] - s[k-1][1]); return L; });
      const durs = lens.map(L => 900 + L * 2.4), gap = 450, lag = 260;
      const tStart = performance.now();
      function step(now) {
        if (mode !== 1 || !m1Busy) return;
        const elapsed = now - tStart - lag;
        const r = cv.getBoundingClientRect();
        strokes = [];
        let acc = 0, activeTip = null;
        for (let k = 0; k < st.length; k++) {
          if (elapsed >= acc + durs[k]) {
            strokes.push(st[k].map(p => [p[0] / cv.width, p[1] / cv.height]));
            if (elapsed < acc + durs[k] + gap && k + 1 < st.length) {
              const u = (elapsed - (acc + durs[k])) / gap;
              const pEnd = st[k][st[k].length - 1], pNext = st[k + 1][0];
              activeTip = [pEnd[0] + (pNext[0] - pEnd[0]) * u, pEnd[1] + (pNext[1] - pEnd[1]) * u];
            }
            acc += durs[k] + gap;
            continue;
          }
          if (elapsed >= acc) {
            const prog = Math.min(1, (elapsed - acc) / durs[k]);
            const { out } = partial(st[k], lens[k] * prog);
            strokes.push(out.map(p => [p[0] / cv.width, p[1] / cv.height]));
            activeTip = out[out.length - 1];
          }
          break;
        }
        redraw();
        if (activeTip) {
          setFingerPos(r.left + (activeTip[0] / cv.width) * r.width, r.top + (activeTip[1] / cv.height) * r.height, 0);
        }
        const totalTrace = durs.reduce((a, d) => a + d, 0) + gap * (st.length - 1);
        if (elapsed < totalTrace) {
          m1Raf = requestAnimationFrame(step);
        } else {
          const rSp = $("spSound").getBoundingClientRect();
          setFingerPos(rSp.left + rSp.width / 2, rSp.top + rSp.height / 2, 850);
          const tSpDown = setTimeout(() => {
            if (mode !== 1 || !m1Busy) return;
            ddFinger.style.transform = "scale(0.84)";
            $("spSound").style.transform = "scale(0.84)";
            laut("A");
          }, 1150);
          const tSpUp = setTimeout(() => {
            if (mode !== 1 || !m1Busy) return;
            ddFinger.style.transform = "scale(1)";
            $("spSound").style.transform = "";
          }, 1550);
          const tToNext = setTimeout(() => {
            if (mode !== 1 || !m1Busy) return;
            const rNext = $("next").getBoundingClientRect();
            setFingerPos(rNext.left + rNext.width / 2, rNext.top + rNext.height / 2, 800);
          }, 1850);
          const t4 = setTimeout(() => {
            if (mode !== 1 || !m1Busy) return;
            ddFinger.style.transform = "scale(0.84)";
            $("next").style.transform = "scale(0.84)";
          }, 2800);
          const t5 = setTimeout(() => {
            if (mode !== 1 || !m1Busy) return;
            $("next").style.transform = "";
            stopM1Demo();
            go(0);
          }, 3200);
          m1Timers.push(tSpDown, tSpUp, tToNext, t4, t5);
        }
      }
      m1Raf = requestAnimationFrame(step);
    }, 950);
    m1Timers.push(tGlide, tTrace);
  }, 500);
  m1Timers.push(t1);
}

// ---------- Bedienung ----------
let curAudio = null;
// Spielt audio/<Buchstabe>.mp3 ab (z. B. audio/M.mp3); fehlt die Datei, bleibt es still
function laut(l) {
  if (curAudio) { curAudio.pause(); curAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  const a = new Audio("audio/" + encodeURIComponent(l) + ".mp3");
  curAudio = a;
  a.play().catch(() => {});
}
let soundTimer = null;
function go(n) {
  i = (n + DATA.length) % DATA.length; render();
  clearTimeout(soundTimer);
  if (mode === 1) soundTimer = setTimeout(() => laut(DATA[i][0]), 400);
}
function setMode(m) {
  mode = m;
  document.body.classList.toggle("m1", m === 1);
  document.body.classList.toggle("m2", m === 2);
  $("mode").textContent = m;
  document.querySelectorAll("#menu .opt").forEach(o => o.classList.toggle("cur", +o.dataset.m === m));
  stopM1Demo();
  stopDdDemo();
  if (m === 1) { fit(); runM1Demo(); }
  else if (m === 2) { clearTimeout(soundTimer); stopAnim(); startDdRound(); }
  else { clearTimeout(soundTimer); stopAnim(); i = 0; fit(); render(); drawTemplate(); }
}
$("mode").onclick = () => $("menu").classList.add("show");
$("menu").onclick = e => {
  const o = e.target.closest(".opt");
  $("menu").classList.remove("show");
  if (o && +o.dataset.m !== mode) setMode(+o.dataset.m);
};
$("spSound").onclick = () => { if (!m1Busy) { laut(DATA[i][0]); startAnim(); } };
function warn(el = $("right")) {
  el.classList.remove("wackeln");
  void el.offsetWidth;
  el.classList.add("wackeln");
}
function finale() {
  const f = $("fin");
  f.querySelectorAll(".konf").forEach(k => k.remove());
  const farben = ["#e03131", "#f08c00", "#2b8a3e", "#1c7ed6", "#9c36b5", "#fcc419"];
  for (let k = 0; k < 70; k++) {
    const c = document.createElement("div");
    c.className = "konf";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = farben[k % farben.length];
    c.style.animationDuration = (2.5 + Math.random() * 2) + "s";
    c.style.animationDelay = (Math.random() * 1.5) + "s";
    f.appendChild(c);
  }
  f.classList.add("show");
  say("Super!");
  setTimeout(() => {
    f.classList.remove("show");
    setMode(mode === 1 ? 2 : mode === 2 ? 3 : 1);
  }, 3000);
}

// ---------- Übung 2: Drag-and-Drop Großbuchstaben ----------
const LETTERS_26 = DATA.map(d => d[0]);
const ddTop = $("ddTop"), ddFinger = $("ddFinger");
const ddCards = Array.from(document.querySelectorAll("#ddGrid .dd-card"));
let ddQueue = [], ddIdx = 0, ddTarget = "A", ddBusy = false, ddDrag = null, ddTimers = [];

function shuffle(arr) {
  const a = arr.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}
function stopDdDemo() {
  ddTimers.forEach(t => clearTimeout(t));
  ddTimers = [];
  ddFinger.style.display = "none";
  ddFinger.style.transition = "none";
  ddTop.style.transition = "none";
  ddTop.style.transform = "";
  ddTop.style.opacity = "1";
  ddCards.forEach(c => c.classList.remove("ok"));
  ddDrag = null;
}
function setupDdBoard(letter, fixedChoices) {
  ddTarget = letter;
  ddTop.textContent = letter;
  ddTop.style.transition = "none";
  ddTop.style.transform = "";
  ddTop.style.opacity = "1";
  ddTop.classList.remove("wackeln", "dragging");
  const choices = fixedChoices || (() => {
    const pool = shuffle(LETTERS_26.filter(x => x !== letter)).slice(0, 3);
    pool.push(letter);
    return shuffle(pool);
  })();
  ddCards.forEach((c, idx) => {
    c.textContent = choices[idx];
    c.classList.remove("ok");
  });
  const ts = setTimeout(() => { if (mode === 2) laut(letter); }, 300);
  ddTimers.push(ts);
}
$("spDd").onclick = () => laut(ddTarget);
function startDdRound() {
  stopDdDemo();
  ddQueue = LETTERS_26.slice();
  ddIdx = 0;
  runDdDemo();
}
function runDdDemo(left = 2) {
  ddBusy = true;
  setupDdBoard("A", ["B", "A", "M", "S"]);
  const t1 = setTimeout(() => {
    if (mode !== 2) return;
    const rTop = ddTop.getBoundingClientRect();
    const targetCard = ddCards[1];
    const rTar = targetCard.getBoundingClientRect();
    const sx = rTop.left + rTop.width * 0.35, sy = rTop.top + rTop.height * 0.45;
    const dx = (rTar.left + rTar.width / 2) - (rTop.left + rTop.width / 2);
    const dy = (rTar.top + rTar.height / 2) - (rTop.top + rTop.height / 2);
    ddFinger.style.transition = "none";
    ddFinger.style.left = sx + "px";
    ddFinger.style.top = sy + "px";
    ddFinger.style.transform = "translate(0, 0) scale(1)";
    ddFinger.style.display = "block";
    const t2 = setTimeout(() => {
      if (mode !== 2) return;
      ddTop.classList.add("dragging");
      ddTop.style.transition = "transform 1.3s ease-in-out";
      ddFinger.style.transition = "transform 1.3s ease-in-out";
      ddTop.style.transform = `translate(${dx}px, ${dy}px)`;
      ddFinger.style.transform = `translate(${dx}px, ${dy}px) scale(0.95)`;
    }, 500);
    const t3 = setTimeout(() => {
      if (mode !== 2) return;
      ddTop.classList.remove("dragging");
      ddTop.style.opacity = "0";
      ddFinger.style.display = "none";
      targetCard.classList.add("ok");
    }, 1850);
    const t4 = setTimeout(() => {
      if (mode !== 2) return;
      if (left > 1) runDdDemo(left - 1);
      else nextDdTask();
    }, 2700);
    ddTimers.push(t2, t3, t4);
  }, 450);
  ddTimers.push(t1);
}
function nextDdTask() {
  if (ddIdx >= ddQueue.length) {
    ddBusy = true;
    finale();
    return;
  }
  ddBusy = false;
  setupDdBoard(ddQueue[ddIdx]);
}
ddTop.addEventListener("pointerdown", e => {
  if (mode !== 2 || ddBusy) return;
  ddTop.setPointerCapture(e.pointerId);
  ddTop.classList.remove("wackeln");
  ddTop.classList.add("dragging");
  ddTop.style.transition = "none";
  ddDrag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 };
});
ddTop.addEventListener("pointermove", e => {
  if (!ddDrag || e.pointerId !== ddDrag.id) return;
  ddDrag.dx = e.clientX - ddDrag.sx;
  ddDrag.dy = e.clientY - ddDrag.sy;
  ddTop.style.transform = `translate(${ddDrag.dx}px, ${ddDrag.dy}px)`;
});
function endDdDrag(e) {
  if (!ddDrag || e.pointerId !== ddDrag.id) return;
  ddTop.classList.remove("dragging");
  const rTop = ddTop.getBoundingClientRect();
  const cx = rTop.left + rTop.width / 2, cy = rTop.top + rTop.height / 2;
  ddDrag = null;
  let hit = null, bestDist = Infinity;
  for (const c of ddCards) {
    const r = c.getBoundingClientRect();
    const ox = Math.max(0, Math.min(rTop.right, r.right) - Math.max(rTop.left, r.left));
    const oy = Math.max(0, Math.min(rTop.bottom, r.bottom) - Math.max(rTop.top, r.top));
    const pointerInside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (pointerInside || (ox * oy > (r.width * r.height) * 0.2)) {
      const dist = Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2));
      if (dist < bestDist) { bestDist = dist; hit = c; }
    }
  }
  if (!hit) {
    ddTop.style.transition = "transform .2s ease-out";
    ddTop.style.transform = "";
    return;
  }
  if (hit.textContent === ddTarget) {
    ddBusy = true;
    ddTop.style.opacity = "0";
    hit.classList.add("ok");
    ddIdx++;
    const t = setTimeout(() => { if (mode === 2) nextDdTask(); }, 650);
    ddTimers.push(t);
  } else {
    ddTop.style.transition = "none";
    ddTop.style.transform = "";
    warn(ddTop);
  }
}
ddTop.addEventListener("pointerup", endDdDrag);
ddTop.addEventListener("pointercancel", endDdDrag);
$("next").onclick = () => {
  if (m1Busy) return;
  if (strokes.length === 0) warn();
  else if (i === DATA.length - 1) finale();
  else go(i + 1);
};
$("spWord").onclick = () => say(DATA[i][2]);

DATA.forEach((d, k) => {
  const b = document.createElement("button");
  b.textContent = d[0];
  b.onclick = () => { if (!m1Busy) go(k); };
  $("strip").appendChild(b);
});
window.addEventListener("resize", fit);
fit(); setMode(1);
</script>
